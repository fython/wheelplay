name: Android Debug Build

on:
  push:
    # PR branches are verified by pull_request; use workflow_dispatch before opening a PR.
    branches:
      - main
    tags:
      - '**'
    paths-ignore:
      - '**.md'
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Locate preinstalled Android SDK
        id: android-sdk
        run: |
          test -d "$ANDROID_HOME/cmdline-tools/latest/bin"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      # Platform and build-tools are preinstalled and root-owned on GitHub runners.
      - name: Cache downloaded native Android toolchain
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.android-sdk.outputs.root }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ steps.android-sdk.outputs.root }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: android-native-toolchain-v2-ubuntu24-${{ runner.arch }}-ndk${{ env.ANDROID_NDK_VERSION }}-cmake${{ env.ANDROID_CMAKE_VERSION }}

      - name: Verify SDK installation helper
        run: node --test test/ci-android-*.test.js

      - name: Install missing Android packages
        run: |
          bash .github/scripts/install-android-packages.sh \
            "platforms;android-$ANDROID_API_LEVEL" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

      - name: Build and verify Debug
        run: ./gradlew --no-daemon --build-cache :projection-plugin-api:testDebugUnitTest :projection-plugin-api:assembleRelease :projection-plugin-sample:lintDebug :projection-plugin-sample:assembleDebug :shared:testDebugUnitTest :common:testDebugUnitTest :common:assembleDebugAndroidTest :mobile:lintDebug :mobile:assembleDebug :mobile:assembleDebugAndroidTest

      - name: Upload plugin SDK and independent sample APK
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-projection-plugin-sdk-and-sample
          path: |
            projection-plugin-api/build/outputs/aar/projection-plugin-api-release.aar
            projection-plugin-sample/build/outputs/apk/debug/projection-plugin-sample-debug.apk
          if-no-files-found: error

      - name: Upload failed unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-unit-test-results
          path: |
            projection-plugin-api/build/reports/tests/
            projection-plugin-api/build/test-results/
            shared/build/reports/tests/
            shared/build/test-results/
            common/build/reports/tests/
            common/build/test-results/
          if-no-files-found: warn

      - name: Upload browser runtime test APK
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-browser-runtime-tests
          path: common/build/outputs/apk/androidTest/debug/common-debug-androidTest.apk
          if-no-files-found: error

      - name: Upload plugin runtime test APK
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-plugin-runtime-tests
          path: mobile/build/outputs/apk/androidTest/debug/mobile-debug-androidTest.apk
          if-no-files-found: error

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: warn

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-lint-results
          path: mobile/build/reports/lint-results-debug.*
          if-no-files-found: warn

  browser-runtime:
    name: Browser HTTP on Android ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 36]
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android SDK
        id: runtime-sdk
        run: echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      # Only cache downloaded images. Preinstalled platform directories are root-owned;
      # restoring them caused thousands of tar errors. Each run gets a fresh AVD.
      - name: Cache Android system image
        uses: actions/cache@v4
        with:
          path: ${{ steps.runtime-sdk.outputs.root }}/system-images/android-${{ matrix.api-level }}/google_apis/x86_64
          key: android-system-image-v2-ubuntu24-${{ runner.arch }}-api${{ matrix.api-level }}-google_apis-x86_64

      - name: Download browser runtime test APK
        uses: actions/download-artifact@v4
        with:
          name: wheelplay-browser-runtime-tests
          path: runtime-tests

      - name: Download plugin runtime test APK
        uses: actions/download-artifact@v4
        with:
          name: wheelplay-plugin-runtime-tests
          path: plugin-tests

      - name: Download host APK
        uses: actions/download-artifact@v4
        with:
          name: wheelplay-debug-apk
          path: plugin-host

      - name: Download independent sample APK
        uses: actions/download-artifact@v4
        with:
          name: wheelplay-projection-plugin-sdk-and-sample
          path: plugin-sdk

      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm

      - name: Start adb outside the emulator action
        run: adb start-server > adb-server.log 2>&1

      - name: Verify browser and plugin runtimes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          avd-name: browser-runtime
          force-avd-creation: true
          # Detach output from the action pipes so emulator helper processes cannot
          # keep a successful step alive after adb emu kill (seen on API 28).
          emulator-options: -no-snapshot -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none > emulator.log 2>&1 < /dev/null
          disable-animations: true
          script: bash .github/scripts/run-android-runtime-tests.sh

      - name: Stop adb
        if: always()
        run: timeout --kill-after=5s 15s adb kill-server || true

      - name: Upload runtime test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-api-${{ matrix.api-level }}
          path: |
            browser-runtime.log
            plugin-runtime.log
            runtime-logcat.log
            runtime-services.log
            emulator.log
            adb-server.log
          if-no-files-found: warn
