name: Android Debug Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Build and verify Debug
        run: ./gradlew --no-daemon :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: warn

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-lint-results
          path: mobile/build/reports/lint-results-debug.*
          if-no-files-found: warn