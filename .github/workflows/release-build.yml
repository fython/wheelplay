name: Android Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Install Android toolchain
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          bash .github/scripts/install-android-packages.sh \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build signed Release APK and App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/build-signed-android.sh :mobile:assembleRelease :mobile:bundleRelease
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose mobile/build/outputs/apk/release/mobile-release.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: wheelplay-release
          path: |
            mobile/build/outputs/apk/release/mobile-release.apk
            mobile/build/outputs/bundle/release/mobile-release.aab
          if-no-files-found: error
